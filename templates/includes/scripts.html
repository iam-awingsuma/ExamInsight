<!-- Core JS vendor library inclusions (Popper, Bootstrap, Perfect Scrollbar, Smooth Scrollbar) -->
<script src="{{ url_for('static', filename='assets/js/core/popper.min.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/core/bootstrap.min.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/plugins/perfect-scrollbar.min.js') }}"></script>
<script src="{{ url_for('static', filename='assets/js/plugins/smooth-scrollbar.min.js') }}"></script>

<!-- Initialize custom smooth scrollbar plugin for Windows OS platform sidebar navigation -->
<script>
    var win = navigator.platform.indexOf('Win') > -1;
    if (win && document.querySelector('#sidenav-scrollbar')) {
        var options = {
        damping: '0.5'
        }
        Scrollbar.init(document.querySelector('#sidenav-scrollbar'), options);
    }
</script>

<!-- Soft UI Dashboard core layout initialization script -->
<script src="{{ url_for('static', filename='assets/js/soft-ui-dashboard.min.js') }}?v=1.1.0"></script>

<!-- Automatically dismiss Bootstrap alert notifications after a 3-second delay -->
<script>
  // Select all elements with the class 'alert'
  var alertList = document.querySelectorAll('.alert');
  alertList.forEach(function(alert) {
    // Automatically dismiss after 3 seconds (3000 milliseconds)
    setTimeout(function() {
      // Use Bootstrap's built-in alert dismiss function
      var bsAlert = new bootstrap.Alert(alert);
      bsAlert.close();
    }, 3000); 
  });
</script>
